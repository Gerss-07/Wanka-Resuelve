<a class="panel-salto" href="#contenido-ciudadano">Saltar al contenido</a>
<aside class="panel-lateral">
  <a class="panel-marca" routerLink="/" aria-label="Portada de Wanka Resuelve">
    <img src="/images/logo-wanka-resuelve.png" width="156" alt="Wanka Resuelve">
  </a>
  <nav aria-label="Navegación ciudadana">
    <p>Área ciudadana</p>
    <a routerLink="/ciudadano" routerLinkActive="actual" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"><svg lucideHouse aria-hidden="true" [size]="19"></svg>Inicio</a>
    <a routerLink="/ciudadano/reportes" routerLinkActive="actual" [routerLinkActiveOptions]="{ exact: true }" ariaCurrentWhenActive="page"><svg lucideClipboardList aria-hidden="true" [size]="19"></svg>Mis reportes</a>
    <a routerLink="/ciudadano/reportes/nuevo" routerLinkActive="actual" ariaCurrentWhenActive="page"><svg lucidePlusCircle aria-hidden="true" [size]="19"></svg>Nuevo reporte</a>
    <a routerLink="/ciudadano/seguimiento" routerLinkActive="actual" ariaCurrentWhenActive="page"><svg lucideMapPin aria-hidden="true" [size]="19"></svg>Seguimiento</a>
  </nav>
</aside>
<div class="panel-area">
  <header class="panel-superior">
    <span>Wanka Resuelve <span class="panel-divisor" aria-hidden="true">/</span> Área ciudadana</span>
    @if (ciudadano(); as nombre) {
      <span class="panel-persona"><b aria-hidden="true">{{ nombre.charAt(0).toUpperCase() }}</b>{{ nombre }}</span>
    }
  </header>
  <main id="contenido-ciudadano" tabindex="-1">
    <router-outlet />
  </main>
  @if (modoDesarrollo) {
    <footer class="panel-aviso"><span>Identidad temporal de desarrollo</span></footer>
  }
</div>
